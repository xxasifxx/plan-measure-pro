  - id: BS-001
    name: App Shell Scaffolding & Routing
    status: shipped
    durationDays: 5   # M
    rationale: >
      Vite + React + TailwindCSS scaffold, React Router v6 route table
      (ProtectedRoute / AuthRoute / AdminRoute guards), PersistQueryClientProvider
      with IDB persister, BiometricGate wrapper, and NativeFirstRun wizard wiring.
      Constitutes the load-bearing frame for every surface.
    sources:
      - src/App.tsx
      - src/lib/pwa.ts
      - src/lib/offline/idb-persister.ts
      - pages.md (cross-cutting)
    prerequisites: []
    subTasks:
      - task: Configure Vite project, tsconfig, path aliases                days: 0.5
      - task: Define React Router v6 route table with all known paths       days: 0.5
      - task: Implement ProtectedRoute / AuthRoute / AdminRoute guards      days: 1
      - task: Wire PersistQueryClientProvider + createIdbPersister          days: 1
      - task: Add BiometricGate global wrapper                              days: 0.5
      - task: Add NativeFirstRun wizard entry point                         days: 0.5
      - task: Smoke-test all routes render without crash                    days: 1
    workItemHint: ["app-shell", "route:auth", "route:takeoff"]

  - id: BS-002
    name: Design Token System & Theme Engine
    status: shipped
    durationDays: 5   # M
    rationale: >
      CSS custom-property token set (colors, spacing, radii, shadows) driving
      both light and dark themes via useTheme hook and Tailwind dark-mode class
      strategy. TooltipProvider global context. Must precede all UI work.
    sources:
      - src/hooks/useTheme.ts
      - src/index.css (implied)
      - pages.md (cross-cutting: dark/light theme toggle)
    prerequisites: [BS-001]
    subTasks:
      - task: Define full semantic color token palette (light + dark)       days: 1
      - task: Map tokens to Tailwind config (extend.colors / extend.spacing) days: 0.5
      - task: Implement useTheme hook with localStorage persistence          days: 0.5
      - task: Add ThemeToggle button component wired globally                days: 0.5
      - task: Add TooltipProvider to App root                               days: 0.5
      - task: Visual QA across key pages in both themes                     days: 2
    workItemHint: ["styles", "hook:useTheme"]

  - id: BS-003
    name: Build Pipeline & CI/CD
    status: shipped
    durationDays: 3   # S
    rationale: >
      Vite production build, Vitest unit test runner, GitHub Actions (or Lovable
      CI) pipeline with lint → test → build → deploy. Establishes baseline
      quality gates for all future sprints.
