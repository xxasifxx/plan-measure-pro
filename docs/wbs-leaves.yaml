      - task: Extract text blocks in region via pdf.js getTextContent       days: 1
      - task: Multi-cluster algorithm: detect sheet-number + name rows      days: 1.5
      - task: Write TOC jsonb to projects row; display in page nav dropdown days: 1
      - task: Handle no-TOC fallback (manual sheet list)                   days: 0.5
