      offline IDB fallback, and real-time presence overlay. Foundational for
      all annotation and calibration work.
    sources:
      - scope-inventory.json (cap.takeoff.pdf-canvas)
      - pages.md (project-workspace)
      - src/lib/pdf-utils.ts
    prerequisites: [BS-001, BE-001, PL-001]
    subTasks:
      - task: Wrap pdf.js worker in pdf-utils; expose renderPage()          days: 2
      - task: Build PdfCanvas component with <canvas> layer stack          days: 2
      - task: Page nav controls (prev/next/jump/fit-to-screen)             days: 1
      - task: Signed-URL fetch from project-pdfs with stale/revalidate     days: 1
      - task: IndexedDB PDF cache fallback (offline-pdf-cache.ts)          days: 2
      - task: Realtime presence dot overlay (useProject onlineUsers)       days: 1
      - task: Performance: progressive page rendering + canvas memoization  days: 1
